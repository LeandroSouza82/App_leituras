name: Temporary Export Validation Fix

on:
  push:
    branches:
      - fix/bloqueio-exportacao-unidade-intocada

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply validation fix
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('src/components/LeituraFotoModal/LeituraFotoModal.jsx'); s=p.read_text(); old='''        // Checa se o usuário tirou foto ou interagiu com este apartamento\n        const statusFoto = fotosCapturadas[apStr] || {};\n        const statusConcluido = concluidosMemoria[apStr] || {};\n        const hasInteraction = statusFoto[srv] || statusConcluido[srv] || leiturasVal[apStr]?.[srv] !== undefined;\n\n        // Se não mexeu no apartamento, pula a validação dele (permite lote parcial)\n        if (!hasInteraction) continue;\n\n        // Se interagiu, verifica se a leitura é válida\n'''; new='''        // Todas as unidades do serviço selecionado são obrigatórias na exportação.\n        // Mesmo uma unidade totalmente intocada deve ser identificada como pendente.\n'''; assert old in s, 'bloco esperado nao encontrado'; p.write_text(s.replace(old,new,1))"

      - name: Verify change
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only)" = "src/components/LeituraFotoModal/LeituraFotoModal.jsx"

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/LeituraFotoModal/LeituraFotoModal.jsx
          git commit -m "fix: bloqueia exportacao com unidade sem leitura [skip ci]"
          git push origin HEAD:fix/bloqueio-exportacao-unidade-intocada
