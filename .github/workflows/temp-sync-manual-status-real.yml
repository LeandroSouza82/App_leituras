name: Temp Truthful Manual Sync Status

on:
  push:
    branches:
      - "fix/sync-manual-status-real"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch and validate
        shell: bash
        run: |
          python3 .github/tmp_patch_sync_manual.py
          git diff --check
          npm install --legacy-peer-deps
          git checkout -- package-lock.json
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-sync-manual-status-real.yml .github/tmp_patch_sync_manual.py
          git add src/components/BackupFotosMenu/BackupFotosMenu.jsx
          git commit -m "fix: torna status da sincronizacao manual verdadeiro [skip ci]"
          git push origin HEAD:fix/sync-manual-status-real
