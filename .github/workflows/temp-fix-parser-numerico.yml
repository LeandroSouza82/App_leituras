name: Temp Fix Remaining Numeric Parser

on:
  push:
    branches:
      - "fix/parser-numerico-restante"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch and validate
        shell: bash
        run: |
          python3 .github/tmp_patch_parser.py
          git diff --check
          npm install --legacy-peer-deps
          git checkout -- package-lock.json
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-fix-parser-numerico.yml .github/tmp_patch_parser.py
          git add src/components/LeituraFotoModal/LeituraFotoModal.jsx
          git commit -m "fix: usa parser canonico no fluxo restante [skip ci]"
          git push origin HEAD:fix/parser-numerico-restante
