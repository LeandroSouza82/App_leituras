name: Validar APK Android

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, card-progresso]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps
      - name: Verificar configuração pública do cliente
        run: node scripts/check-public-build-env.mjs
      - name: Build Web App
        run: npm run build
      - name: Sync Capacitor Android
        run: npx cap sync android
      - name: Build APK de validação
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload APK de validação
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-validacao-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
