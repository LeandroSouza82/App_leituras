name: Temp Isolate Delete By Condo

on:
  push:
    branches:
      - "fix/exclusao-isolada-condominio"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch and validate
        shell: bash
        run: |
          python3 .github/tmp_patch_exclusao.py
          git diff --check
          node --check src/components/LeituraFotoModal/LeituraFotoModal.jsx
          npm install --legacy-peer-deps
          git checkout -- package-lock.json
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-isolate-delete-condo.yml .github/tmp_patch_exclusao.py
          git add src/components/LeituraFotoModal/LeituraFotoModal.jsx
          git commit -m "fix: isola exclusao por condominio [skip ci]"
          git push origin HEAD:fix/exclusao-isolada-condominio
