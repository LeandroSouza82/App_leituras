name: Temp Remove Legacy Reading Update

on:
  push:
    branches:
      - "fix/remover-update-legado-leitura-anterior"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch and validate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/services/syncService.js')
          text = p.read_text(encoding='utf-8')
          start = text.index('        // UPDATE encadeado na tabela da unidade (apartamento) preparando para o próximo mês\n')
          end_marker = '        etapaSync = \'REMOVER_FILA\';\n'
          end = text.index(end_marker, start)
          p.write_text(text[:start] + text[end:], encoding='utf-8')
          PY
          git diff --check
          node --check src/services/syncService.js
          npm install --legacy-peer-deps
          git checkout -- package-lock.json
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-remove-legacy-reading-update.yml
          git add src/services/syncService.js
          git commit -m "fix: remove update legado de leitura anterior [skip ci]"
          git push origin HEAD:fix/remover-update-legado-leitura-anterior
