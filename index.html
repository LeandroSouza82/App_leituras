<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fast Leituras</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      var path = window.location.pathname;
      if (path === '/confirmacao-email') {
        import('/src/confirmacaoEmailMain.jsx');
      }
    </script>
    <script type="module">
      var path = window.location.pathname;
      if (path === '/redefinir-senha') {
        import('/src/redefinirSenhaMain.jsx');
      }
    </script>
    <script type="module">
      var path = window.location.pathname;
      if (path !== '/confirmacao-email' && path !== '/redefinir-senha') {
        import('/src/main.jsx');
      }
    </script>
  </body>
</html>
