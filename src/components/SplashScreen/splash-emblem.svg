    <filter id="shadow" x="-30%" y="-20%" width="160%" height="155%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#174a76" flood-opacity=".14"/>
    </filter>
  </defs>

  <!-- Escudo aberto sobre fundo transparente: a silhueta substitui o disco. -->
