    <path d="m79 123 6 5m-15 14h10m-6 18 9-4" stroke="#78bbd6" stroke-width="3" stroke-linecap="round"/>

    <!-- Gota e ondas de água. -->
    <path d="M163 113c-7 13-19 28-19 39a19 19 0 0 0 38 0c0-11-12-26-19-39Z" fill="url(#water)" stroke="#1c6097" stroke-width="3" stroke-linejoin="round"/>
    <path d="M153 148c-3 8 0 13 6 15" stroke="#d8f6ff" stroke-width="3" stroke-linecap="round"/>
    <path d="M137 176c8-7 16 7 25 0s15 4 20 0m-47 8c9-6 16 6 25 0s15 3 20 0" stroke="#76b9d4" stroke-width="2.5" stroke-linecap="round"/>

