<svg xmlns="http://www.w3.org/2000/svg" width="240" height="264" viewBox="0 0 240 264" fill="none">
  <defs>
    <linearGradient id="shield" x1="47" y1="47" x2="193" y2="209" gradientUnits="userSpaceOnUse">
      <stop stop-color="#236fac"/>
      <stop offset="1" stop-color="#0b2353"/>
    </linearGradient>
    <linearGradient id="porcelain" x1="72" y1="78" x2="167" y2="201" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff"/>
