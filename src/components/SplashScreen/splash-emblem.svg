    <circle cx="120" cy="218" r="37" fill="url(#silver)" stroke="#174977" stroke-width="3"/>
    <circle cx="120" cy="218" r="30" fill="#eef8ff" stroke="#96c5e2" stroke-width="2"/>
    <path d="M108 194h24" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <rect x="94" y="201" width="52" height="20" rx="4" fill="#15395e"/>
    <text x="120" y="216" text-anchor="middle" fill="#fff" font-family="monospace" font-size="14" font-weight="bold" letter-spacing="1.5">00145</text>
