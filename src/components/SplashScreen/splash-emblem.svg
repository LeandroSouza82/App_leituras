    <linearGradient id="flame" x1="109" y1="20" x2="134" y2="107" gradientUnits="userSpaceOnUse">
      <stop stop-color="#78dbff"/>
      <stop offset=".55" stop-color="#2499ed"/>
      <stop offset="1" stop-color="#164b85"/>
    </linearGradient>
    <linearGradient id="silver" x1="78" y1="183" x2="159" y2="251" gradientUnits="userSpaceOnUse">
