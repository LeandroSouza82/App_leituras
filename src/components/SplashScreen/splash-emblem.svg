    <path d="M72 83c-4 1-8 2-12 2v48c0 21 8 38 22 52" stroke="#fff" stroke-width="3" stroke-linecap="round"/>

    <!-- Chama azul, mantendo a identidade do símbolo original. -->
    <path d="M111 13c8 26-12 36-16 54-4 19 7 35 23 40-6-12-3-20 3-29 1 12 8 18 10 28 23-9 29-29 21-44-5-11-16-17-18-27 0 12-4 16-7 20 3-18-5-32-16-42Z" fill="url(#flame)" stroke="#174977" stroke-width="3" stroke-linejoin="round"/>
    <path d="M113 30c2 17-12 28-12 41" stroke="#d7f5ff" stroke-width="3" stroke-linecap="round"/>
    <path d="M120 57c3 16-10 21-8 34 1 5 4 9 8 12-2-12 11-17 11-28-5 3-6-9-11-18Z" fill="#e1f8ff"/>

